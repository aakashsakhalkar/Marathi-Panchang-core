<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>मराठी पंचांग टेस्ट (CDN Test Page)</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Tiro Devanagari Marathi', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
      padding: 2rem;
      max-width: 550px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    h1 {
      font-family: 'Tiro Devanagari Marathi', serif;
      color: #ffcf40;
      font-size: 2rem;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    .badge {
      display: block;
      text-align: center;
      color: #4ade80;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .input-box {
      margin-bottom: 1.5rem;
      display: flex;
      gap: 0.5rem;
    }
    input[type="date"] {
      flex: 1;
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 0.8rem;
      border-radius: 0.5rem;
      font-size: 1rem;
    }
    button {
      background: #ff8c00;
      color: white;
      border: none;
      padding: 0.8rem 1.2rem;
      border-radius: 0.5rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover {
      background: #e07b00;
    }
    .result-box {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 0.75rem;
      padding: 1.25rem;
      margin-top: 1rem;
    }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .row:last-child {
      border-bottom: none;
    }
    .label {
      color: #94a3b8;
    }
    .val {
      font-weight: 700;
      color: #ffffff;
    }
    .highlight {
      color: #ffcf40;
    }
  </style>

  <!-- 🌐 Live CDN Import directly from your GitHub repository! -->
  <script src="https://cdn.jsdelivr.net/gh/aakashsakhalkar/Marathi-Panchang-core@main/dist/index.js"></script>
</head>
<body>

  <div class="card">
    <h1>🚩 मराठी पंचांग (Live CDN)</h1>
    <span class="badge">● Live from github:aakashsakhalkar/Marathi-Panchang-core</span>

    <div class="input-box">
      <input type="date" id="dateInput">
      <button onclick="calculatePanchang()">पंचांग पहा</button>
    </div>

    <div class="result-box" id="result">
      <p style="text-align: center; color: #94a3b8;">लोड होत आहे...</p>
    </div>
  </div>

  <script>
    // Set default date to today
    const dateInput = document.getElementById('dateInput');
    dateInput.value = new Date().toISOString().split('T')[0];

    function calculatePanchang() {
      const selectedDate = dateInput.value;
      const resultDiv = document.getElementById('result');

      try {
        // Call global MarathiPanchang loaded via jsDelivr CDN
        const panchang = MarathiPanchang.getMarathiPanchang(selectedDate);

        resultDiv.innerHTML = `
          <div class="row">
            <span class="label">दिनांक (Date)</span>
            <span class="val">${panchang.date} (${panchang.dayOfWeek.nameMarathi})</span>
          </div>
          <div class="row">
            <span class="label">मराठी महिना (Month)</span>
            <span class="val highlight">${panchang.month.fullMonthNameMarathi}</span>
          </div>
          <div class="row">
            <span class="label">तिथि (Tithi)</span>
            <span class="val highlight">${panchang.tithi.pakshaMarathi} ${panchang.tithi.nameMarathi}</span>
          </div>
          <div class="row">
            <span class="label">नक्षत्र (Nakshatra)</span>
            <span class="val">${panchang.nakshatra.nameMarathi} (पद ${panchang.nakshatra.pada})</span>
          </div>
          <div class="row">
            <span class="label">शके (Shaka Samvat)</span>
            <span class="val">${panchang.samvat.shakaSamvat} (${panchang.samvat.shakaSamvatsaraName})</span>
          </div>
          <div class="row">
            <span class="label">सूर्योदय / सूर्यास्त</span>
            <span class="val">☀️ ${panchang.astronomy.sunrise} / 🌆 ${panchang.astronomy.sunset}</span>
          </div>
          <div class="row">
            <span class="label">चंद्रोदय (Sankashti Moonrise)</span>
            <span class="val">🌙 ${panchang.astronomy.moonrise}</span>
          </div>
          <div class="row">
            <span class="label">राहू काळ (Rahu Kaal)</span>
            <span class="val" style="color: #ff6b6b;">${panchang.muhurta.rahuKaal.start} - ${panchang.muhurta.rahuKaal.end}</span>
          </div>
          <div class="row">
            <span class="label">अभिजित मुहूर्त (Abhijit)</span>
            <span class="val" style="color: #4ade80;">${panchang.muhurta.abhijitMuhurta.start} - ${panchang.muhurta.abhijitMuhurta.end}</span>
          </div>
          <div class="row">
            <span class="label">सण / उत्सव (Festivals)</span>
            <span class="val" style="color: #ff80ab;">${panchang.festivals.length > 0 ? panchang.festivals.map(f => f.nameMarathi).join(', ') : 'साधारण दिवस'}</span>
          </div>
        `;
      } catch (err) {
        resultDiv.innerHTML = `<p style="color: #ff6b6b;">Error: ${err.message}</p>`;
      }
    }

    // Run automatically on page load
    calculatePanchang();
  </script>
</body>
</html>
